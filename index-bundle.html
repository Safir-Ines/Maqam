<style>
  :root{
    /* Algerian Warmth — default */
    --c-clay:#C0392B;
    --c-amber:#E67E22;
    --c-sun:#F9C74F;
    --c-mint:#2C7A51;
    --c-cream:#FFF6E5;
    --c-paper:#FFFBF1;
    --c-ink:#2A1810;
    --c-soft:#FFE9C4;
    --c-shadow:rgba(60,30,10,.18);
    --font-arabic:'Cairo','Tajawal',system-ui,sans-serif;
    --font-display:'Reem Kufi Fun','Cairo',sans-serif;
    --font-fun:'Lalezar','Cairo',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-arabic);
    color:var(--c-ink);
    background:var(--c-paper);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* Paper grain texture */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(rgba(192,57,43,.04) 1px, transparent 1px),
      radial-gradient(rgba(44,122,81,.03) 1px, transparent 1px);
    background-size: 22px 22px, 18px 18px;
    background-position: 0 0, 9px 9px;
    opacity:.6;
  }
  #root{position:relative;z-index:1}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  /* Custom scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--c-soft);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:var(--c-amber)}

  /* Reusable */
  .crayon-shadow{filter:drop-shadow(0 6px 0 var(--c-shadow))}
  .squish{transition:transform .15s ease}
  .squish:active{transform:scale(.96)}

  /* Loading */
  #loading{
    position:fixed;inset:0;display:grid;place-items:center;
    background:var(--c-paper);z-index:99;
  }
  #loading .ball{
    width:60px;height:60px;border-radius:50%;
    background:var(--c-clay);
    animation:bounce 1s ease-in-out infinite alternate;
  }
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-30px)}}
</style>
</head>
<body>
<div id="root">
  <div id="loading"><div class="ball"></div></div>
</div>
